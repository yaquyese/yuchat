<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="bg-gradient-to-r from-purple-500 to-blue-500 text-white p-3 text-center font-bold">
  Timeline Chat
</div>

<div id="chat" class="p-3 pb-24 overflow-y-auto h-[90vh]"></div>

<!-- 输入 -->
<div class="fixed bottom-0 w-full bg-white p-2 flex gap-2 shadow-lg">
  <input id="input" class="flex-1 bg-gray-100 rounded-full px-4" placeholder="输入内容">

  <input type="file" id="file" hidden>

  <button onclick="pickFile()" class="px-3">＋</button>
  <button onclick="sendText()" class="bg-blue-500 text-white px-4 rounded-full">发送</button>
</div>

<!-- 清空 -->
<button onclick="clearAll()" class="fixed top-3 right-3 bg-red-500 text-white px-3 py-1 rounded">
清空
</button>

<script>
const chat = document.getElementById("chat");

async function load() {
  const res = await fetch("/api/list");
  const data = await res.json();

  chat.innerHTML = "";

  data.forEach(item => {
    let html = "";

    if (item.type === "text") {
      html = `
      <div class="flex justify-end mb-2">
        <div class="bg-gradient-to-r from-green-400 to-emerald-500 text-white px-3 py-2 rounded-2xl max-w-[75%]">
          ${item.content}
        </div>
      </div>`;
    }

    if (item.type === "file") {
      html = `
      <div class="flex justify-end mb-2">
        <a href="/file/${item.file_key}" target="_blank"
        class="bg-white shadow p-3 rounded-xl max-w-[70%] block">
          📎 文件
        </a>
      </div>`;
    }

    chat.innerHTML += html;
  });

  chat.scrollTop = chat.scrollHeight;
}

async function sendText() {
  const input = document.getElementById("input");
  if (!input.value) return;

  await fetch("/api/add", {
    method: "POST",
    body: JSON.stringify({
      type: "text",
      content: input.value
    })
  });

  input.value = "";
  load();
}

function pickFile() {
  document.getElementById("file").click();
}

document.getElementById("file").onchange = async function() {
  const file = this.files[0];

  const form = new FormData();
  form.append("file", file);

  const res = await fetch("/api/upload", {
    method: "POST",
    body: form
  });

  const data = await res.json();

  await fetch("/api/add", {
    method: "POST",
    body: JSON.stringify({
      type: "file",
      file_key: data.file_key
    })
  });

  load();
};

async function clearAll() {
  if (!confirm("确定清空？")) return;

  await fetch("/api/clear", { method: "POST" });
  load();
}

load();
</script>

</body>
</html>
